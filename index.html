<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjong Score Table</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a green felt table with four seat tiles is the home screen; you tap the seat that won.
   Everything else is quiet lists around it. Tile faces keep fixed ivory colours in both themes. */
:root{
  --bg:#EDF1EB; --surface:#FBFCF9; --ink:#14201A; --muted:#586860; --line:#D0D9D0;
  --felt:#1E6A4C; --felt-deep:#124632; --on-felt:#F2F7F1;
  --up:#17694A; --down:#B23A2C; --bamboo:#C99A3B;
  --tile:#FAF7EC; --tile-ink:#18221C; --tile-red:#BE3527; --tile-green:#1F7A4D; --tile-blue:#2B5C9E;
  --display:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",Georgia,serif;
  --body:"Schibsted Grotesk",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#17211C; --ink:#E7EDE7; --muted:#97A69C; --line:#2B3931;
    --felt:#226F51; --felt-deep:#0F3B2B; --on-felt:#F2F7F1;
    --up:#62C99A; --down:#F0907F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#17211C; --ink:#E7EDE7; --muted:#97A69C; --line:#2B3931;
  --felt:#226F51; --felt-deep:#0F3B2B; --on-felt:#F2F7F1;
  --up:#62C99A; --down:#F0907F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--bamboo);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
#view{display:flex;flex-direction:column;gap:16px}
#resume{position:sticky;top:8px;z-index:5}
#resume:empty{display:none}
.num{font-variant-numeric:tabular-nums}
.zh{font-family:var(--display);font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 96px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.01em}
.top .rule{font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);flex-basis:100%}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.sync.live::before{background:var(--up)}.sync.warn::before{background:var(--bamboo)}
.ro .eo{display:none!important}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--bamboo);padding:2px 0 2px 10px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--felt);color:var(--on-felt);border-radius:12px;padding:10px 12px;font-size:14px}
.resume button{background:var(--on-felt);color:var(--felt-deep);border:0;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap}

/* felt table */
.status{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.status b{color:var(--ink)}
.felt{background:var(--felt);border-radius:20px;padding:16px 12px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:"w w w" "n c s" "e e e";gap:12px 8px;box-shadow:inset 0 0 0 4px var(--felt-deep)}
.seat{position:relative;background:var(--tile);color:var(--tile-ink);border:0;border-radius:10px;padding:8px 6px 9px;box-shadow:0 5px 0 var(--bamboo);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:92px;min-width:0;text-align:center}
.seat:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bamboo)}
.seat .wind{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.seat .wind small{font:700 13px var(--body)}
.seat .who{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere;max-width:100%}
.seat .pts{font-size:15px;font-variant-numeric:tabular-nums}
.seat .pts.up{color:#17694A}.seat .pts.down{color:#B23A2C}
.seat .zhuang{position:absolute;top:-8px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--tile-red);color:#fff;font-family:var(--display);font-weight:900;font-size:15px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--felt)}
.pos-0{grid-area:e;justify-self:center;width:min(62%,210px)}
.pos-2{grid-area:w;justify-self:center;width:min(62%,210px)}
.pos-1{grid-area:s}.pos-3{grid-area:n}
.centre{grid-area:c;color:var(--on-felt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-width:0}
.centre .round{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.1}
.centre .hand{font-size:13px;opacity:.85}
.centre button{margin-top:4px;background:transparent;color:var(--on-felt);border:1.5px solid rgba(242,247,241,.6);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.hint{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;min-height:46px}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.btn.danger{color:var(--down)}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:17px}
.card h2 .zh{font-size:18px;margin-right:6px}
.sub{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .rank{width:1.4em;color:var(--muted);font-variant-numeric:tabular-nums}
.list .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.list .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.amt.up{color:var(--up)}.amt.down{color:var(--down)}

/* leaderboard */
.leadlink{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:inherit}
.leadlink .who{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.leadlink .go{font-weight:700;white-space:nowrap;color:var(--muted)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lb li{display:grid;grid-template-columns:32px 1fr auto;gap:5px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb .rk{grid-row:1 / span 3;align-self:start;width:30px;height:40px;border-radius:5px;background:var(--tile);color:var(--tile-ink);box-shadow:0 3px 0 var(--bamboo),0 0 0 1px rgba(20,32,26,.14);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.lb li.first .rk{color:var(--tile-red)}
.lb .nm{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.lb .nm .tag{font-weight:500;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.lb .tot{font-size:20px}
.lb .bar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.lb .bar i{position:absolute;top:0;bottom:0}
.lb .bar i.up{left:50%;background:var(--up)}.lb .bar i.down{right:50%;background:var(--down)}
.lb .st{grid-column:2 / 4;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.lb .st b{color:var(--ink);font-variant-numeric:tabular-nums}

/* history */
.hand-row{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.hand-row:first-of-type{border-top:0}
.hand-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hand-head .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.fanpill{font-family:var(--display);font-weight:900;font-size:14px;background:var(--felt);color:var(--on-felt);border-radius:6px;padding:1px 7px;white-space:nowrap}
.fanpill.limit{background:var(--tile-red);color:#fff}
.deltas{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:14px}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:6px 8px;padding-bottom:4px}
.tg{display:flex;gap:2px}
.tile{width:25px;height:34px;background:var(--tile);color:var(--tile-ink);border-radius:4px;box-shadow:0 3px 0 var(--bamboo),0 0 0 1px rgba(20,32,26,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;line-height:1}
.tile b{font-size:14px;font-weight:900}
.tile i{font-style:normal;font-size:11px;margin-top:1px}
.t-m i{color:var(--tile-red)}.t-p b,.t-p i{color:var(--tile-blue)}.t-s b,.t-s i{color:var(--tile-green)}
.t-h b{font-size:19px}
.t-C b{color:var(--tile-red)}.t-F b{color:var(--tile-green)}
.t-P b{width:15px;height:21px;border:2.5px solid var(--tile-blue);border-radius:2px}

/* rules */
.paytable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.paytable th{font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;font-size:12px;vertical-align:bottom}
.paytable td{text-align:right;padding:6px;border-top:1px solid var(--line)}
.paytable th:first-child,.paytable td:first-child{text-align:left}
.grp-h{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.grp-h .zh{font-size:20px;font-weight:900}
.grp-h span:last-child{color:var(--muted);font-size:14px}
.rule-card{scroll-margin-top:70px}
.rule-card.focus{border-color:var(--bamboo);box-shadow:0 0 0 3px var(--bamboo)}
.rule-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rule-head .zh{font-size:21px;font-weight:900}
.rule-head .en{color:var(--muted);font-size:14px;flex:1}
.rule-card p{margin:0;font-size:15px}
.rule-card .extra{font-size:13px;color:var(--muted)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-head button{background:none;border:0;padding:10px 4px;font-weight:700;color:var(--muted)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:560px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 14px}
.sheet-foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sec-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:none;display:flex;gap:8px;align-items:baseline}
.sec-h .zh{font-size:16px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;min-height:46px;overflow-wrap:anywhere;text-align:left}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.pats{display:flex;flex-direction:column;gap:8px}
.pat{display:grid;grid-template-columns:1fr 46px;gap:8px}
.pat-main{display:flex;align-items:center;gap:10px;min-height:54px;padding:7px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:0}
.pat-main .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.pat-main .nm .zh{font-size:18px;font-weight:900;line-height:1.2}
.pat-main .nm small{font-size:12.5px;opacity:.8;overflow-wrap:anywhere}
.pat-main .fan{font-family:var(--display);font-weight:900;font-size:15px;white-space:nowrap}
button.pat-main[aria-pressed="true"],.pat-main.on{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
button.pat-main:disabled{opacity:.45;cursor:not-allowed}
.info{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:18px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:8px;border:1.5px solid currentColor;background:transparent;font-weight:700;font-size:18px;line-height:1;opacity:.9}
.step button:disabled{opacity:.3}
.step output{min-width:1.4em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.adj{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .big{font-family:var(--display);font-weight:900;font-size:24px}
.sum .why{font-size:13px;color:var(--muted)}
.pays{font-size:14px;display:flex;gap:2px 12px;flex-wrap:wrap}
.warn{font-size:14px;color:var(--down);font-weight:500}

/* forms */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field select,.field input,.pl input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
.seatpick{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}
.seatpick .zh{font-size:26px;font-weight:900;text-align:center}
.pl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pl button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;padding:0 12px;color:var(--muted);font-weight:700;font-size:14px}

/* nav, toast, dialog */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 10px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:700;border-top:3px solid transparent;margin-top:-1px}
.nav a .zh{font-size:18px;font-weight:900;line-height:1.2}
.nav a[aria-current="page"]{color:var(--felt);border-top-color:var(--felt)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{color:var(--up);border-top-color:var(--up)}}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:var(--up);border-top-color:var(--up)}
.toast{position:fixed;left:16px;right:16px;bottom:76px;z-index:40;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toast[hidden]{display:none}
.toast button{background:none;border:1.5px solid currentColor;border-radius:8px;padding:6px 10px;font-weight:700;color:inherit;white-space:nowrap}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(8,14,11,.55);display:grid;place-items:center;padding:20px}
.dlg[hidden]{display:none}
.dlg .box{background:var(--surface);border-radius:14px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg p{margin:0}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Keep the session balance in sight on the table, reference pages and entry sheets. */
.wrap{max-width:656px;gap:14px}
.top{padding:8px 0 0;align-items:center}
.top h1{display:flex;align-items:center;gap:13px;font-size:clamp(1.55rem,5vw,2.15rem);line-height:1.2;letter-spacing:-.035em}
.top h1 small{display:block;font-size:.85rem;letter-spacing:.18em;margin-top:4px;color:var(--muted)}
.brand-tile{width:34px;height:46px;border:1px solid #c8c4ae;background:var(--tile);border-radius:6px;box-shadow:0 4px #b19759,3px 5px 0 var(--felt-deep);display:grid;padding:5px}
.brand-tile i{width:9px;height:9px;border:2px solid var(--tile-green);border-radius:50%;place-self:start}
.brand-tile i:nth-child(2){place-self:center;border-color:var(--tile-red)}
.brand-tile i:last-child{place-self:end;border-color:var(--tile-blue)}
.top .rule{font-size:.82rem}
.connection{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.connection .sync{flex-basis:auto;flex:1 1 135px}
.share{background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:.85rem;font-weight:700;padding:9px 12px}
.tally,.sheet-tally{background:var(--surface);color:var(--ink);padding:9px 14px 10px;border:1px solid var(--line);border-top:3px solid var(--felt);border-radius:11px}
.tally{position:sticky;top:0;z-index:7;box-shadow:0 4px 14px rgba(10,39,26,.09)}
.tally:empty{display:none}
.tally-title{display:flex;align-items:baseline;justify-content:space-between;font-size:.78rem;color:var(--muted);gap:5px}
.tally-title b{font-size:.85rem;color:var(--ink)}
.balances{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:5px}
.balances>div{padding:0 8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.balances>div:first-child{padding-left:0;border:0}
.tally-name{font-size:.82rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balances .amt{font-size:1.18rem;line-height:1.15}
.sheet-tally{border-radius:0;border-width:0 0 1px;width:100%;max-width:656px;margin:0 auto;flex-shrink:0}
#resume{top:92px;z-index:6}
.rule-card{scroll-margin-top:165px}
.felt{background:radial-gradient(ellipse at 50% 40%,#297357,#14523c);gap:16px 10px;padding:22px 16px 25px;box-shadow:inset 0 0 0 3px var(--felt-deep),inset 0 0 0 7px #42735b,inset 0 0 0 8px #749878}
.felt .wind small{font:600 .82rem var(--body)}
.felt .seat{justify-content:center}.seat .pts small{font-size:.7rem;color:#53675a}
.note{line-height:1.5}
.sheet-head,.sheet-foot{flex:none}
.sheet-foot{max-height:43dvh;overflow-y:auto}
.sheet-foot .why{max-height:3.5em;overflow-y:auto}
.sheet-body{min-height:0}
body:has(.sheet:not([hidden])){overflow:hidden}
.tile-example{margin:0}
.tile-example figcaption{font-size:.8rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.tiles .tg{flex-wrap:wrap;max-width:100%}
.rules-card p,.card p{overflow-wrap:anywhere}
.pay-scroll{overflow-x:auto}
.paytable th{text-align:center}
.paytable thead tr:first-child th{border-bottom:1px solid var(--line);font-weight:700}
.refs a,summary{color:var(--up);font-weight:700}
.refs a{display:block;font-size:.88rem}
summary{cursor:pointer;min-height:40px;padding-top:8px}
.glossary{margin:8px 0}
.glossary dt{font-weight:600}
.glossary dd{margin:2px 0 10px;color:var(--muted)}
@media(max-width:400px){.wrap{padding-left:10px;padding-right:10px}.tally{padding-left:9px;padding-right:9px}.felt{gap:12px 5px;padding-left:9px;padding-right:9px}.tally-title{font-size:.73rem}}
@media(max-height:550px) and (orientation:landscape){.sheet-tally{padding:2px 8px}.sheet-tally .balances>div{flex-direction:row;gap:6px}.sheet-foot .in{gap:2px}.sheet-head,.sheet-foot{padding:4px 10px}.sheet-foot .why{display:none}}
</style>

<body>
<header class="top masthead">
  <h1><span class="brand-tile" aria-hidden="true"><i></i><i></i><i></i></span><span>Mahjong<small lang="zh-Hant">麻將記分桌</small></span></h1>

<script>
/* =====================================================================
   RULE SETS. To add another variant (riichi, Sichuan, ...) add an entry
   here with the same shape, then pick it in Setup. Nothing else in the
   page is specific to Hong Kong rules.
   ===================================================================== */
const RULESETS = {
  hk: {
    id: 'hk',
    label: 'Hong Kong 香港',
    winds: [{zh:'東',en:'East'},{zh:'南',en:'South'},{zh:'西',en:'West'},{zh:'北',en:'North'}],
    options: [
      {key:'minFan', label:'Minimum fan to win · 起和番數', def:3,
       choices:[[0,'0 fan / 番 · Basic win allowed / 可和雞糊'],[1,'1 fan / 番'],[2,'2 fan / 番'],[3,'3 fan / 番'],[4,'4 fan / 番']]},
      {key:'limitFan', label:'Fan cap · 番數上限（爆棚）', def:10,
       choices:[[8,'8 fan / 番'],[10,'10 fan / 番'],[13,'13 fan / 番']]},
      {key:'discardPay', label:'Who pays on a discard? · 放銃時誰付分？', def:'half',
       choices:[['half','Discarder pays half · 半銃（放銃者付一半）'],['full','Discarder pays all · 全銃（放銃者全付）']]}
    ],
    // points for 0..13 fan. Self-draw: each loser pays 2x this.
    baseByFan: [1,2,4,8,16,24,32,48,64,96,128,192,256,384],
    selfDraw: {id:'zimo', zh:'自摸', en:'Self-draw', fan:1, group:'win',
      desc:'You draw the winning tile yourself. Selecting Self-draw adds this fan automatically on an ordinary win. Flower wins have their own fixed value.'},
    groups: [
      {id:'win', zh:'食糊', en:'How the hand was won'},
      {id:'shape', zh:'牌型', en:'Shape of the hand'},
      {id:'honour', zh:'番子', en:'Winds and dragons'},
      {id:'flower', zh:'花', en:'Flowers'},
      {id:'limit', zh:'爆棚', en:'Limit hands'}
    ],
    patterns: [
      {id:'menqing', group:'win', zh:'門前清', en:'Concealed hand', fan:1,
       desc:'You made no exposed chows, pungs or kongs before winning. A concealed kong is allowed.',
       extra:'House bonus. You may claim a discard for the winning tile.'},
      {id:'qianggang', group:'win', zh:'搶槓', en:'Robbing a kong', fan:1, needs:'discard',
       desc:'Another player adds a fourth tile to an exposed pung, and that tile completes your hand.',
       extra:'Record it as a win off that player.'},
      {id:'gangshang', group:'win', zh:'槓上開花', en:'Kong replacement win', fan:1, needs:'self', excl:['huashang'],
       desc:'You declare a kong and the replacement tile completes your hand.',
       extra:'The self-draw fan also counts.'},
      {id:'haidi', group:'win', zh:'海底撈月', en:'Last tile', fan:1, needs:'self',
       desc:'You win on the very last tile drawn from the wall.',
       extra:'The self-draw fan also counts.'},
      {id:'huashang', group:'win', zh:'花上自摸', en:'Flower replacement win', fan:1, needs:'self', excl:['wuhua'],
       desc:'You draw a flower, and the replacement tile completes your hand.',
       extra:'House bonus. The self-draw fan also counts.'},

      {id:'pinghu', group:'shape', zh:'平糊', en:'All chows', fan:1, excl:['duidui','hunyaojiu','dragon','seatwind','roundwind','xiaosanyuan','dasanyuan'],
       desc:'Four chows (runs of three) and a pair. No pungs or kongs.', ex:'123m 456m 234p 678s 55p'},
      {id:'duidui', group:'shape', zh:'對對糊', en:'All pungs', fan:3,
       desc:'Four pungs or kongs and a pair. No chows.', ex:'222m 555p 111p 777s 33s'},
      {id:'hunyise', group:'shape', zh:'混一色', en:'Mixed one suit', fan:3, excl:['qingyise'],
       desc:'Tiles from one suit only, plus winds or dragons.', ex:'123m 345m 888m SSS FF'},
      {id:'qingyise', group:'shape', zh:'清一色', en:'Full flush', fan:7, excl:['hunyaojiu','dragon','seatwind','roundwind','xiaosanyuan','dasanyuan'],
       desc:'Every tile from the same suit. No winds or dragons.', ex:'123p 345p 567p 888p 99p'},
      {id:'hunyaojiu', group:'shape', zh:'混么九', en:'Mixed terminals', fan:1, implies:['duidui'],
       desc:'Four pungs or kongs and a pair. Use only 1s, 9s, winds and dragons, including both suited and honour tiles.', ex:'111m 999p 999s EEE CC',
       extra:'Selecting this also counts All pungs, for 4 fan together.'},

      {id:'dragon', group:'honour', zh:'箭刻', en:'Dragon pung (中 發 白)', fan:1, max:2, excl:['xiaosanyuan','dasanyuan'],
       desc:'Score 1 fan for each pung or kong of red, green or white dragons.', ex:'CCC',
       extra:'With two dragon pungs and a pair of the third dragon, select Little three dragons.'},
      {id:'seatwind', group:'honour', zh:'門風', en:'Seat wind pung', fan:1,
       desc:'A pung or kong of your own seat wind. The table screen shows each player\'s wind.', ex:'SSS',
       extra:'Example shown for the South seat.'},
      {id:'roundwind', group:'honour', zh:'圈風', en:'Round wind pung', fan:1,
       desc:'A pung or kong of the round wind.', ex:'EEE',
       extra:'If the round wind is also your seat wind, tick both for 2 fan.'},
      {id:'xiaosanyuan', group:'honour', zh:'小三元', en:'Little three dragons', fan:5, excl:['dasanyuan'],
       desc:'Pungs or kongs of two dragons and a pair of the third.', ex:'CCC FFF PP 123m 456s',
       extra:'The 5 fan already covers the two dragon pungs.'},
      {id:'dasanyuan', group:'honour', zh:'大三元', en:'Big three dragons', fan:8,
       desc:'A pung or kong of each of the three dragons.', ex:'CCC FFF PPP 123m 55s',
       extra:'The 8 fan already covers the dragon pungs.'},
      {id:'xiaosixi', group:'limit', zh:'小四喜', en:'Little four winds', fan:'limit',
       desc:'Pungs or kongs of three different winds, plus a pair of the fourth wind.', ex:'EEE SSS WWW NN 123m'},

      {id:'wuhua', group:'flower', zh:'無花', en:'No flowers', fan:1, excl:['zhenghua','yitaihua','qihua','bahua'],
       desc:'You hold no flower or season tiles at all.'},
      {id:'zhenghua', group:'flower', zh:'正花', en:'Own flower', fan:1, max:2,
       desc:'A flower or season whose number matches your seat: East 1, South 2, West 3, North 4.',
       extra:'Up to two: one flower and one season.'},
      {id:'yitaihua', group:'flower', zh:'一台花', en:'Set of four flowers', fan:1,
       desc:'All four flowers (梅 蘭 菊 竹) or all four seasons (春 夏 秋 冬).',
       extra:'Also select Own flower once for the seat-matching tile in this set. Together they give 2 fan.'},
      {id:'qihua', group:'flower', zh:'七隻花', en:'Seven flowers', fan:3, needs:'self', standalone:true,
       desc:'When you draw your seventh flower or season, you may immediately win before taking a replacement tile.',
       extra:'Select Self-draw. The whole win is 3 fan, including the draw and flowers.'},

      {id:'shisanyao', group:'limit', zh:'十三么', en:'Thirteen orphans', fan:'limit',
       desc:'One each of every 1, 9, wind and dragon, plus a second copy of any one of them.', ex:'19m 19p 19s ESWN CFP C'},
      {id:'jiulian', group:'limit', zh:'九子連環', en:'Nine gates', fan:'limit',
       desc:'1112345678999 in one suit, all concealed, plus one more tile of that suit.', ex:'1112345678999m 5m'},
      {id:'kankan', group:'limit', zh:'坎坎糊', en:'Four concealed pungs', fan:'limit',
       desc:'Four concealed pungs and a pair, without a kong. A discard may complete the pair. You must draw the fourth pung yourself.', ex:'222m 666m 444p 888s 55p'},
      {id:'dasixi', group:'limit', zh:'大四喜', en:'Big four winds', fan:'limit',
       desc:'A pung or kong of each of the four winds, plus a pair.', ex:'EEE SSS WWW NNN 55m'},
      {id:'ziyise', group:'limit', zh:'字一色', en:'All honours', fan:'limit',
       desc:'Only winds and dragons.', ex:'EEE WWW CCC FFF NN'},
      {id:'qingyaojiu', group:'limit', zh:'清么九', en:'All terminals', fan:'limit',
       desc:'Only 1s and 9s.', ex:'111m 999m 111p 999s 11s'},
      {id:'shiba', group:'limit', zh:'十八羅漢', en:'Four kongs', fan:'limit',
       desc:'Four kongs and a pair, 18 tiles in all.'},
      {id:'gangshanggang', group:'limit', zh:'槓上槓自摸', en:'Consecutive kong win', fan:'limit', needs:'self',
       desc:'Declare two kongs in succession and win on the second replacement draw. There must be no flower replacement between them.'},
      {id:'tianhu', group:'limit', zh:'天糊', en:'Heavenly hand', fan:'limit', needs:'self',
       desc:'The dealer wins with the first 14 tiles dealt. Record as self-draw.'},
      {id:'dihu', group:'limit', zh:'地糊', en:'Earthly hand', fan:'limit', needs:'discard',
       desc:'A player wins off the dealer\'s very first discard.'},
      {id:'bahua', group:'limit', zh:'八隻花', en:'Eight flowers', fan:'limit', needs:'self', standalone:true,
       desc:'Collect all eight flowers and seasons and declare a self-drawn limit win.'}
    ],
    // who pays what for one winning hand. Returns {base, deltas:{playerId: points}}
    settle({fan, winner, from, seats}, o){
      const base = this.baseByFan[Math.min(fan, this.baseByFan.length - 1)];
      const d = {}; seats.forEach(p => d[p] = 0);
      const losers = seats.filter(p => p !== winner);
      if (!from) losers.forEach(p => d[p] = -2 * base);
      else if (o.discardPay === 'full') d[from] = -4 * base;
      else losers.forEach(p => d[p] = (p === from ? -2 : -1) * base);
      d[winner] = -losers.reduce((s, p) => s + d[p], 0);
      return {base, deltas: d};
    },
    // dealer keeps the deal after winning or after a drawn hand
    dealerStays(hand, dealerId){ return hand.kind === 'draw' || hand.winner === dealerId; }
  }
};
const DEFAULT_RULESET = 'hk';

/* ============================ state ============================ */
const KEY = 'mahjong-score-table-v1';
let lbSort = 'pts';
let state, draft = null, sheetOpen = false, seatDraft = null, focusRule = null, toastTimer = null, dlgYes = null;

function freshState(){
  const players = [1,2,3,4,5].map(n => ({id:'p'+n, name:'Player '+n, openSeat:true}));
  const s = {v:1, money:0, ruleset:DEFAULT_RULESET, opts:{}, players, nextId:6, example:true,
    games:[{id:1, seats:players.slice(0,4).map(p => p.id), hands:[]}]};
  return s;
}
function fixState(s){
  if (!s || !Array.isArray(s.players) || !Array.isArray(s.games) || !s.games.length) return freshState();
  if (!RULESETS[s.ruleset]) s.ruleset = DEFAULT_RULESET;
  s.opts = s.opts && typeof s.opts === 'object' ? s.opts : {};
  if (typeof s.money !== 'number') s.money = 0;
  // shared scores come from other people's phones, so tidy them before use
  const id = x => String(x).replace(/[^\w-]/g, '');
  s.players.forEach(p => { p.id = id(p.id); p.name = String(p.name).slice(0, 24); });
  for (const g of s.games) {
    if (!Array.isArray(g.seats) || g.seats.length !== 4 || !Array.isArray(g.hands)) return freshState();
    g.seats = g.seats.map(id);
    g.hands.forEach(h => {
      h.fan = Number(h.fan) || 0; h.round = (Number(h.round) || 0) % 4;
      h.winner = id(h.winner || ''); h.from = h.from ? id(h.from) : null;
      const d = {}; for (const k in (h.deltas || {})) d[id(k)] = Number(h.deltas[k]) || 0; h.deltas = d;
      if (!Array.isArray(h.lines)) h.lines = [];
    });
  }
  return s;
}
function load(){ try { return fixState(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return freshState(); } }
function keep(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function save(){ if (liveTable.active) { liveTable.saveChange(); return; } keep(); if (sync.mode === 'live' && !ro()) { dirty = true; flush(); } }

/* ============================ shared scores ============================
   One shared document holds the whole score sheet. Everyone with the page
   open gets it live; people who may not write see a view-only table.
   Without it (page opened outside Claude, or not signed in) scores stay
   on this phone. */
const sync = {hosted:!!(window.claude && window.claude.use), mode:'local', canWrite:null, exists:false, slow:false, lost:false, shown:null, last:null};
let ref = null, writing = false, dirty = false, slowTimer = null;
const ro = () => liveTable.viewer || (sync.mode === 'live' && sync.canWrite === false);
const RO_OK = new Set(['lbSort','copy','dlgNo','copyTableLink','tableFocus','myView','openChat']);
function refresh(){ render(); if (sheetOpen && draft) renderHand(true); }
function adopt(d){
  sync.shown = d.stamp;
  state = fixState(JSON.parse(JSON.stringify(d.state)));
  keep();
  if (draft && !game().seats.includes(draft.winner)) { draft = null; closeHand(); }
}
async function flush(){
  if (writing || !dirty || !ref) return;
  writing = true; dirty = false;
  const first = !sync.exists, stamp = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  sync.shown = stamp;
  try {
    await ref.set({stamp, at:new Date().toISOString(), state:JSON.parse(JSON.stringify(state))});
    sync.exists = true; if (first) refresh();
  } catch(e){
    if (e && e.code === 'invalid_argument' && sync.canWrite !== true) {
      sync.canWrite = false; if (sync.last) adopt(sync.last);
      toast('View only · 僅供查看，只有記分員可修改。');
    } else toast('Sync failed. Saved on this device. 同步失敗，分數保存在此裝置。');
    refresh();
  }
  writing = false; if (dirty) flush();
}
function onSnap(snap){
  const before = sync.mode + sync.exists + sync.slow;
  if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(slowTimer); sync.slow = false; }
  sync.mode = 'live';
  let changed = false;
  if (snap.exists) {
    const d = snap.data(); sync.exists = true;
    if (d && d.state) {
      if (!snap.metadata || !snap.metadata.hasPendingWrites) sync.last = d;
      if (d.stamp !== sync.shown) { adopt(d); changed = true; }
    }
  } else sync.exists = false;
  if (changed || before !== sync.mode + sync.exists + sync.slow) refresh();
}
async function connect(){
  if (!sync.hosted) return;
  sync.mode = 'connecting'; render();
  let db = null;
  try { db = await window.claude.use('db'); } catch(e){}
  if (!db) { sync.mode = 'local'; render(); return; }
  try { const u = await window.claude.use('user'); if (u) sync.canWrite = await u.can('data.write'); } catch(e){}
  try { ref = db.doc('tables/main'); } catch(e){ sync.mode = 'local'; render(); return; }
  slowTimer = setTimeout(() => { sync.slow = true; render(); }, 10000);
  ref.onSnapshot(onSnap, () => { clearTimeout(slowTimer); ref = null; sync.mode = 'local'; sync.lost = true; refresh(); });
}
function syncLine(){
  if (liveTable.active) return [liveTable.online ? 'live' : 'warn', liveTable.status()];
  if (sync.mode === 'connecting') return ['', 'Connecting · 正在連線…'];
  if (sync.mode === 'live') {
    if (sync.slow) return ['warn', 'Waiting for live scores · 等待連線，分數可能尚未更新'];
    if (!sync.exists) return ['warn', ro() ? 'No shared scores yet · 尚無共享分數' : 'Saved on this device · 尚未共享'];
    return ['live', ro() ? 'Live · View only 即時分數・僅供查看' : 'Live scores · 分數即時共享'];
  }
  if (sync.lost) return ['warn', 'Offline. Saving on this device. 連線中斷，目前僅儲存在此裝置。'];
  return ['', sync.hosted ? 'Saved here. Sign in to Claude for shared scores. 已儲存在此裝置，登入 Claude 可查看共享分數。' : 'Saved on this device only · 分數僅存在此裝置'];
}

const R = () => RULESETS[state.ruleset];
function O(){
  const r = R(), o = state.opts[r.id] = state.opts[r.id] || {};
  r.options.forEach(op => { if (!op.choices.some(c => c[0] === o[op.key])) o[op.key] = op.def; });
  return o;
}
const game = () => state.games[state.games.length - 1];
const player = id => state.players.find(p => p.id === id);
const pname = id => (player(id) || {name:'?'}).name;
const active = () => state.players.filter(p => !p.gone);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signed = n => n > 0 ? '+' + n : n < 0 ? '−' + (-n) : '0';
const cash = n => '£' + (n * state.money / 100).toFixed(2);
const cashSigned = n => (n < 0 ? '−' : n > 0 ? '+' : '') + cash(Math.abs(n));
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const pat = id => R().patterns.find(p => p.id === id);

function tableState(g){
  const completed = g.hands.filter(h => h.kind !== 'penalty');
  let d = 0, passes = 0;
  for (const h of completed) if (!R().dealerStays(h, g.seats[d])) { d = (d + 1) % 4; passes++; }
  return {dealer:d, round:Math.floor(passes / 4) % 4, handNo:completed.length + 1};
}
function gameTotals(g){ const t = {}; g.seats.forEach(p => t[p] = 0); g.hands.forEach(h => { for (const p in h.deltas) t[p] = (t[p] || 0) + h.deltas[p]; }); return t; }
function allTotals(){ const t = {}; state.games.forEach(g => { const gt = gameTotals(g); for (const p in gt) t[p] = (t[p] || 0) + gt[p]; }); return t; }
function settleUp(tot){
  const pos = [], neg = [], out = [];
  for (const p in tot) { if (tot[p] > 0) pos.push([p, tot[p]]); else if (tot[p] < 0) neg.push([p, -tot[p]]); }
  pos.sort((a, b) => b[1] - a[1]); neg.sort((a, b) => b[1] - a[1]);
  let i = 0, j = 0;
  while (i < neg.length && j < pos.length) {
    const x = Math.min(neg[i][1], pos[j][1]);
    out.push({from:neg[i][0], to:pos[j][0], n:x});
    neg[i][1] -= x; pos[j][1] -= x;
    if (!neg[i][1]) i++; if (!pos[j][1]) j++;
  }
  return out;
}

/* ============================ scoring a hand ============================ */
function conflicts(id){
  const p = pat(id), set = new Set(p.excl || []);
  R().patterns.forEach(q => {
    if (q.id !== id && (p.standalone || q.standalone || (q.excl || []).includes(id))) set.add(q.id);
  });
  return set;
}
function allowed(p, d){
  if (p.id === 'tianhu' || p.id === 'dihu') {
    const g = game(), dealer = g.seats[tableState(g).dealer];
    if (p.id === 'tianhu' && d.winner !== dealer) return false;
    if (p.id === 'dihu' && (d.winner === dealer || (d.from && d.from !== dealer))) return false;
  }
  return !p.needs || !d.from || (p.needs === 'self') === (d.from === 'self');
}
function scoreDraft(d){
  const r = R(), o = O(), lines = [];
  let total = 0, limit = false;
  const special = r.patterns.find(p => p.standalone && d.picks[p.id] && allowed(p, d));
  if (d.from === 'self' && !special) { lines.push({zh:r.selfDraw.zh, fan:r.selfDraw.fan, n:1}); total += r.selfDraw.fan; }
  r.patterns.forEach(p => {
    const n = d.picks[p.id] || 0; if (!n || (special && p !== special) || !allowed(p, d)) return;
    if (p.fan === 'limit') { limit = true; lines.push({zh:p.zh, fan:'limit', n:1}); }
    else { total += p.fan * n; lines.push({zh:p.zh, fan:p.fan, n}); }
  });
  total += d.adj;
  const fan = limit ? o.limitFan : Math.max(0, Math.min(total, o.limitFan));
  return {fan, raw:total, limit, capped:!limit && total > o.limitFan, lines, ok:!!d.from && (limit || fan >= o.minFan)};
}

const SUIT = {m:'萬',p:'筒',s:'索'};
function tilesHTML(ex){
  const groups = ex.split(' ').map(tok => {
    const m = tok.match(/^(\d+)([mps])$/);
    const ts = m
      ? [...m[1]].map(n => `<span class="tile t-${m[2]}"><b>${m[2] === 'm' ? CN[n] : n}</b><i>${SUIT[m[2]]}</i></span>`)
      : [...tok].map(c => `<span class="tile t-h t-${c}"><b>${c === 'P' ? '' : HON[c]}</b></span>`);
    return `<span class="tg">${ts.join('')}</span>`;
  });
  const suits = {m:'characters 萬', p:'dots 筒', s:'bamboo 索'};
  const honours = {E:'East 東', S:'South 南', W:'West 西', N:'North 北', C:'red dragon 中', F:'green dragon 發', P:'white dragon 白'};
  const label = ex.split(' ').map(tok => {

    return group ? group[1] + ' ' + suits[group[2]] : [...tok].map(c => honours[c]).join(', ');
  }).join(' · ');
  return `<figure class="tile-example"><div class="tiles" aria-hidden="true">${groups.join('')}</div><figcaption>${label}</figcaption></figure>`;
}

function playerStats(){
  const st = {}, mk = id => st[id] = st[id] || {id, pts:0, played:0, wins:0, zimo:0, dealin:0, best:0};
  active().forEach(p => mk(p.id));
  state.games.forEach(g => g.hands.forEach(h => {
    g.seats.forEach(p => { const x = mk(p); if (h.kind !== 'penalty') x.played++; x.pts += h.deltas[p] || 0; });
    if (h.kind !== 'win') return;
    const w = mk(h.winner); w.wins++; if (!h.from) w.zimo++; if (h.fan > w.best) w.best = h.fan;
    if (h.from) mk(h.from).dealin++;
  }));
  return Object.values(st).map(x => ({...x, rate:x.played ? x.wins / x.played : 0}));
}

/* ============================ hand sheet ============================ */
function scoringSeats(d){
  const g = game(), ts = tableState(g), bottom = mySeat.bottom(), totals = allTotals();
  return g.seats.map((id, i) => {
    const wind = R().winds[(i - ts.dealer + 4) % 4];
    const winner = id === d.winner, source = winner ? 'self' : id;
    const label = winner ? 'Self-draw 自摸' : 'Discard 放銃';
    const pos = (i - bottom + 4) % 4;
    return `<div class="edge-seat edge-${pos}"><span class="edge-wall" aria-hidden="true">${'<i></i>'.repeat(9)}</span>
      <button class="source-seat" data-a="from" data-p="${source}" aria-pressed="${d.from === source}"
        aria-label="${esc(pname(id))}, ${wind.en} ${wind.zh}, ${label}, ${signed(totals[id])} total points 總分">
        <span class="seat-wind" aria-hidden="true">${wind.zh}</span><span class="source-person"><b>${esc(pname(id))}</b><small>${wind.en} · ${signed(totals[id])} 分</small></span>
        <span class="source-kind">${label}</span></button></div>`;
  }).join('');
}

let activeCamera = null, cameraPending = false;
function changeCamera(direction, update){
  const root = document.documentElement;
  if (cameraPending) return;
  activeCamera?.skipTransition();
  if (currentView() !== 'table' || matchMedia('(prefers-reduced-motion: reduce)').matches) { update(); return; }
  if (document.startViewTransition) {
    root.dataset.camera = direction;
    cameraPending = true;
    const transition = document.startViewTransition(() => {
      try { update(); } finally { cameraPending = false; }
    });
    activeCamera = transition;
    transition.finished.finally(() => {
      if (activeCamera === transition) { activeCamera = null; delete root.dataset.camera; }
    });
  } else {
    update();
    const scene = direction === 'overhead' ? $('handsheet') : document.querySelector('.pov-stage');
    scene?.animate([{opacity:.25,transform:'perspective(1000px) rotateX(12deg) scale(.96)'},{opacity:1,transform:'none'}],{duration:300,easing:'ease-out'});
  }
}
function renderHand(keepScroll){
  const el = $('handsheet'), r = R(), o = O(), g = game(), d = draft;
  const opening = el.hidden;
  const focused = el.contains(document.activeElement) ? document.activeElement.dataset : null;
  const old = el.querySelector('.sheet-body'), top = keepScroll && old ? old.scrollTop : 0;
  const sc = scoreDraft(d);
  let pays = '', why = '';
  if (sc.ok) {
    const st = r.settle({fan:sc.fan, winner:d.winner, from:d.from === 'self' ? null : d.from, seats:g.seats}, o);
    pays = `<div class="pays num">${g.seats.filter(p => st.deltas[p]).map(p => `<span>${esc(pname(p))} <b class="amt ${cls(st.deltas[p])}">${signed(st.deltas[p])}</b></span>`).join('')}</div>`;
  }
  if (!d.from) why = 'Tap the winner for self-draw, or tap the discarder. 自摸點贏家，放銃點出牌者。';
  else if (!sc.ok) why = `Minimum ${o.minFan} fan · 至少 ${o.minFan} 番才能和牌。`;
  const parts = sc.lines.map(l => patternLineName(l.zh + (l.n > 1 ? '×' + l.n : ''), r)).concat(d.adj ? ['Adjustment 調整 ' + signed(d.adj)] : []);
  el.innerHTML = `
    <div class="score-rail"><h2 id="hs-title" tabindex="-1">${esc(pname(d.winner))} wins <small lang="zh-Hant">和牌</small></h2>
      <span>Hand ${tableState(g).handNo} · 第 ${tableState(g).handNo} 局</span><button data-a="cancelHand">Cancel 取消</button></div>
    <div class="overhead-board">${scoringSeats(d)}${patternPickerHTML(r,d)}</div>
    <div class="sheet-foot"><div class="in">
      <div class="score-readout"><div class="sum"><span class="big">${sc.limit ? 'Limit 爆棚 · ' : ''}${sc.fan} fan 番</span><span class="why">${parts.length ? esc(parts.join(' + ')) : 'Select patterns · 選擇牌型'}${sc.capped ? ` · ${sc.raw} fan 番 · limit 封頂 ${o.limitFan}` : ''}</span></div>
      ${pays}${why ? `<div class="warn">${why}</div>` : ''}</div>
      ${d.from && !sc.ok ? '<button class="btn primary" data-a="openPenalty" data-reason="short">Under minimum · 不夠番喊糊</button>' : `<button class="btn primary" data-a="record" ${sc.ok ? '' : 'disabled'}>Record hand 記錄本局</button>`}
    </div></div>`;
  el.hidden = false; sheetOpen = true;
  if (opening) {
    document.querySelector('.masthead').inert = document.querySelector('.wrap').inert = true;
    $('hs-title').focus({preventScroll:true});
  }
  if (top) el.querySelector('.sheet-body').scrollTop = top;
  if (keepScroll && focused && focused.a) {
    const target = Array.from(el.querySelectorAll('[data-a]')).find(b =>
      b.dataset.a === focused.a && b.dataset.id === focused.id && b.dataset.p === focused.p && b.dataset.n === focused.n);
    if (target && !target.disabled) target.focus({preventScroll:true});
  }
}
function closeHand(){
  $('handsheet').hidden = true; sheetOpen = false;
  document.querySelector('.masthead').inert = document.querySelector('.wrap').inert = false;
}

/* ============================ seat sheet ============================ */
function renderSeats(){
  const r = R(), el = $('seatsheet'), g = game();
  const sel = i => `<div class="seatpick"><span class="zh" aria-hidden="true">${r.winds[i].zh}</span><div class="field"><label for="seat-${i}">${r.winds[i].en} ${r.winds[i].zh}家${i === 0 ? ' · First dealer 起莊' : ''}</label>
    <select id="seat-${i}" data-seat="${i}">${active().map(p => `<option value="${p.id}" ${seatDraft[i] === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>`;
  el.innerHTML = `
    <div class="sheet-head"><h2 id="ss-title">Choose seats 安排座位</h2><button data-a="closeSeats">Cancel 取消</button></div>
    <div class="sheet-tally">${tallyHTML()}</div>
    <div class="sheet-body"><div class="sheet-in">
      <p class="sub">${g.hands.length ? 'A new game will start. Earlier scores stay in the standings. 即將開始新場次，先前分數會保留在排名中。' : 'Choose the seats for this game. 請安排本場座位。'} Choose a seated player to swap seats. 選擇已入座的人即可交換座位。</p>
      ${[0,1,2,3].map(sel).join('')}
      <div class="row"><button class="btn grow" data-a="shuffleSeats">Shuffle seats 隨機換位</button>${active().length > 4 ? '<button class="btn grow" data-a="randomFour">Draw four 隨機選四人</button>' : ''}</div>
    </div></div>
    <div class="sheet-foot"><div class="in"><button class="btn primary" data-a="startGame">${g.hands.length ? 'Start game 開新場' : 'Set seats 確認座位'}</button></div></div>`;
  el.hidden = false;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============================ toast + dialog ============================ */
function toast(msg, undo){
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-a="undoNow">Undo 撤銷</button>' : ''}`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 6000);
}
function ask(msg, yes, fn){
  dlgYes = fn;
  $('dlg').innerHTML = `<div class="box"><p>${esc(msg)}</p><div class="row"><button class="btn grow" data-a="dlgNo">Cancel 取消</button><button class="btn danger grow" data-a="dlgYes">${esc(yes)}</button></div></div>`;
  $('dlg').hidden = false;
}
function undoLast(){ const g = game(); if (g.hands.length) { g.hands.pop(); save(); render(); } }

/* ============================ actions ============================ */
// Browsers without document fullscreen still get the expanded table layout.
let nativeTableFocus = false;
document.addEventListener('keydown', e => {
  if ($('penalty-dialog').open) return;
  if (e.key === 'Escape' && sheetOpen) { A.cancelHand(); return; }
  if (e.key === 'Escape' && !document.fullscreenElement && document.body.classList.contains('table-focus')) {
    document.body.classList.remove('table-focus');
    render();
  }
});
document.addEventListener('fullscreenchange', () => {
  if (nativeTableFocus && !document.fullscreenElement) {
    nativeTableFocus = false;
    document.body.classList.remove('table-focus');
    render();
  }
});
const A = {
  async tableFocus(){
    const enter = document.body.classList.toggle('table-focus');
    render();
    try {
      if (enter && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
        nativeTableFocus = !!document.fullscreenElement;
      } else if (!enter && document.fullscreenElement) await document.exitFullscreen();
    } catch { nativeTableFocus = false; }
    if (enter) window.scrollTo(0, 0);
  },
  myView(){ mySeat.show(); },
  openPenalty(b){ penaltyDialog.open(b.dataset.reason); },
  openChat(){ tableChat.open(); },
  createLiveTable(){
    const profile = mySeat.profile;
    liveTable.create();
    if (profile && liveTable.active) {
      mySeat.remember(profile);
      if ($('arrival').open) $('arrival').close();
      render();
    }
  },
  copyTableLink(){ liveTable.copyLink(); },
  lbSort(b){ lbSort = b.dataset.k; render(); },
  shareNow(){ save(); toast('Sharing scores… 正在共享分數…'); },
  win(b){ changeCamera('overhead', () => {
    draft = {winner:b.dataset.p, from:null, picks:{}, adj:0}; renderHand(false); render();
  }); },
  pickerGroup(b){ draft.pickerGroup = b.dataset.id; renderHand(true); $('handsheet').querySelector('.scoring-field').scrollTop = 0; },
  resumeHand(){
    if (currentView() !== 'table') location.hash = '#table';
    renderHand(false); render();
    const ruleButton = Array.from($('handsheet').querySelectorAll('[data-a="info"]')).find(b => b.dataset.id === draft.lastRule);
    if (ruleButton) { ruleButton.scrollIntoView({block:'center'}); ruleButton.focus({preventScroll:true}); }
  },
  cancelHand(){ changeCamera('seated', () => {
    const id = draft?.winner;
    draft = null; closeHand(); render();
    document.querySelector(`.pov-stage .seat[data-p="${id}"]`)?.focus({preventScroll:true});
  }); },
  from(b){
    draft.from = b.dataset.p;
    R().patterns.forEach(p => { if (!allowed(p, draft)) delete draft.picks[p.id]; });
    renderHand(true);
  },
  pick(b){
    const id = b.dataset.id;
    if (draft.picks[id]) {
      delete draft.picks[id];
      R().patterns.forEach(p => { if ((p.implies || []).includes(id)) delete draft.picks[p.id]; });
    }
    else { conflicts(id).forEach(x => delete draft.picks[x]); draft.picks[id] = 1; (pat(id).implies || []).forEach(x => { conflicts(x).forEach(y => { if (y !== id) delete draft.picks[y]; }); draft.picks[x] = 1; }); }
    renderHand(true);
  },
  inc(b){ const id = b.dataset.id, p = pat(id); conflicts(id).forEach(x => delete draft.picks[x]); draft.picks[id] = Math.min(p.max, (draft.picks[id] || 0) + 1); renderHand(true); },
  dec(b){ const id = b.dataset.id; const n = (draft.picks[id] || 0) - 1; if (n > 0) draft.picks[id] = n; else delete draft.picks[id]; renderHand(true); },
  adj(b){ draft.adj = Math.max(-9, Math.min(13, draft.adj + Number(b.dataset.n))); renderHand(true); },
  info(b){ draft.lastRule = focusRule = b.dataset.id; closeHand(); if (currentView() === 'rules') render(); else location.hash = '#rules'; },
  record(){
    changeCamera('seated', () => {
      if (!draft) return;
      const r = R(), o = O(), g = game(), ts = tableState(g), sc = scoreDraft(draft);
      if (!sc.ok) return;
      const from = draft.from === 'self' ? null : draft.from;
      const st = r.settle({fan:sc.fan, winner:draft.winner, from, seats:g.seats}, o);
      g.hands.push({kind:'win', winner:draft.winner, from, picks:{...draft.picks}, adj:draft.adj, fan:sc.fan, limit:sc.limit, base:st.base,
        deltas:st.deltas, round:ts.round, dealer:g.seats[ts.dealer], lines:sc.lines.map(l => l.zh + (l.n > 1 ? '×' + l.n : ''))});
      const msg = `${pname(draft.winner)} +${st.deltas[draft.winner]} (${sc.fan} fan 番)`;
      const id = draft.winner;
      draft = null; closeHand(); save();
      if (currentView() !== 'table') location.hash = '#table'; else render();
      window.scrollTo(0, 0); toast(msg, true);
      document.querySelector(`.pov-stage .seat[data-p="${id}"]`)?.focus({preventScroll:true});
    });
  },
  drawHand(){
    const g = game(), ts = tableState(g), deltas = {}; g.seats.forEach(p => deltas[p] = 0);
    g.hands.push({kind:'draw', deltas, round:ts.round, dealer:g.seats[ts.dealer], lines:[]});
    save(); render(); toast('Draw recorded. Dealer stays. 已記錄流局，莊家連莊。', true);
  },
  undoNow(){ $('toast').hidden = true; undoLast(); },
  undoAsk(){ ask('Undo the last entry and its points? 撤銷上筆紀錄並還原分數？', 'Undo 撤銷', undoLast); },
  dlgNo(){ $('dlg').hidden = true; dlgYes = null; },
  dlgYes(){ $('dlg').hidden = true; const f = dlgYes; dlgYes = null; if (f) f(); },
  openSeats(){
    if (active().length < 4) { toast('Add at least four players. 請先加入至少四位玩家。'); return; }
    const ok = game().seats.filter(p => player(p) && !player(p).gone);
    const rest = active().map(p => p.id).filter(p => !ok.includes(p));
    seatDraft = ok.concat(rest).slice(0, 4); renderSeats();
  },
  closeSeats(){ $('seatsheet').hidden = true; seatDraft = null; },
  shuffleSeats(){ shuffle(seatDraft); renderSeats(); },
  randomFour(){ seatDraft = shuffle(active().map(p => p.id)).slice(0, 4); renderSeats(); },
  startGame(){
    const g = game();
    if (g.hands.length) state.games.push({id:state.games.length + 1, seats:seatDraft.slice(), hands:[]});
    else g.seats = seatDraft.slice();
    seatDraft = null; $('seatsheet').hidden = true; save();
    if (currentView() !== 'table') location.hash = '#table'; else render();
    window.scrollTo(0, 0);
  },
  addPlayer(){
    const inp = $('newname'), name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    state.players.push({id:'p' + (state.nextId++), name}); state.example = false; save(); render(); $('newname').focus();
  },
  removePlayer(b){
    const id = b.dataset.p, g = game();
    if (g.seats.includes(id)) { toast(pname(id) + ' is seated. Change seats first. 該玩家已入座，請先換座。'); return; }
    const used = state.games.some(x => x.seats.includes(id) && x.hands.length);
    if (used) player(id).gone = true; else state.players = state.players.filter(p => p.id !== id);
    save(); render();
  },
  copy(){
    const tot = allTotals(), ids = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
    const text = ['Mahjong scores 麻將分數 (' + R().label + ')'].concat(ids.map(p => pname(p) + '  ' + signed(tot[p]) + (state.money > 0 ? '  ' + cashSigned(tot[p]) : '')), ['', 'Settle up 結算'],
      settleUp(tot).map(x => `${pname(x.from)} pays 付給 ${pname(x.to)} ${state.money > 0 ? cash(x.n) : x.n + ' pts 分'}`)).join('\n');
    try { navigator.clipboard.writeText(text).then(() => toast('Copied · 已複製分數'), () => toast('Copy unavailable. Take a screenshot. 無法複製，請截圖保存。')); }
    catch(e){ toast('Copy unavailable. Take a screenshot. 無法複製，請截圖保存。'); }
  },
  resetAsk(){ ask('Clear all games and scores? This keeps the players and rules. 清除所有對局和分數？玩家和規則將保留。', 'Clear scores 清除分數', () => {
    state.games = [{id:1, seats:game().seats.slice(), hands:[]}]; draft = null; save(); render(); toast('Scores cleared · 已清除分數'); }); }
};

$('arrival').querySelector('form').addEventListener('submit', mySeat.join);
$('arrival').querySelector('.arrival-close').addEventListener('click', () => $('arrival').close());
$('arrival').addEventListener('cancel', e => { if ($('arrival').querySelector('.arrival-close').hidden) e.preventDefault(); });
$('arrival-seat').addEventListener('change', mySeat.experienceField);
$('arrival-name').addEventListener('input', e => {
  const match = game().seats.find(id => !player(id).openSeat && pname(id).toLocaleLowerCase() === e.target.value.trim().toLocaleLowerCase());
  if (match) { $('arrival-seat').value = match; mySeat.experienceField(); }
  $('join-error').textContent = '';
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled || !A[b.dataset.a]) return;
  if (liveTable.locked && !ro() && !RO_OK.has(b.dataset.a)) { toast(liveTable.status()); return; }
  if (ro() && !RO_OK.has(b.dataset.a)) { toast('Only the scorekeeper can edit. 只有記分員可修改。'); return; }
  A[b.dataset.a](b);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (ro() || liveTable.locked) { render(); return; }
  if (t.classList.contains('pname')) {
    const p = player(t.dataset.p), v = t.value.trim();
    if (p && v) { p.name = v; p.openSeat = false; state.example = false; save(); render(); } else if (p) t.value = p.name;
  } else if (t.dataset.fine) {
    savePenaltySetting(t);
  } else if (t.dataset.opt) {
    const op = R().options.find(x => x.key === t.dataset.opt), c = op.choices.find(x => String(x[0]) === t.value);
    O()[op.key] = c[0]; save(); render();
  } else if (t.id === 'ppp') {
    state.money = Math.max(0, Number(t.value) || 0); save(); render();
  } else if (t.id === 'ruleset') {
    state.ruleset = t.value; draft = null; save(); render();
  } else if (t.dataset.seat !== undefined) {
    const i = Number(t.dataset.seat), j = seatDraft.indexOf(t.value);
    if (j >= 0 && j !== i) seatDraft[j] = seatDraft[i];
    seatDraft[i] = t.value; renderSeats();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newname' && !ro() && !liveTable.locked) A.addPlayer(); });
window.addEventListener('hashchange', () => { const keep = focusRule; render(); if (!keep) window.scrollTo(0, 0); });

function start(data){
  state = liveTable.active ? fixState(liveTable.restore()) : data && data.state ? fixState(data.state) : load();
  draft = data && data.draft ? data.draft : null;
  render();
  if (liveTable.active) liveTable.start(); else connect();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({state, draft}));
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
</script>
